@if (data.title) {
  <h2 mat-dialog-title>{{ data.title }}</h2>
}
<div mat-dialog-content class="confirm-dialog__content">
  <p class="confirm-dialog__message">{{ data.message }}</p>
  @if (data.typeToConfirm; as required) {
    <mat-form-field appearance="outline" class="confirm-dialog__type">
      <mat-label>{{ required.label }}</mat-label>
      <input
        matInput
        data-confirm-text
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        [value]="typed()"
        (input)="onTyped($event)"
        (keydown.enter)="submitTyped($event)"
      />
      @if (required.hint) {
        <mat-hint>{{ required.hint }}</mat-hint>
      }
    </mat-form-field>
  }
</div>
<div mat-dialog-actions align="end">
  <button mat-button type="button" [mat-dialog-close]="false">{{ cancelLabel }}</button>
  <button
    matButton="filled"
    type="button"
    class="confirm-dialog__confirm"
    [class.confirm-dialog__confirm--danger]="tone === 'danger'"
    [class.ui-btn--danger]="tone === 'danger'"
    [disabled]="!canConfirm()"
    [mat-dialog-close]="true"
  >
    {{ confirmLabel }}
  </button>
</div>
