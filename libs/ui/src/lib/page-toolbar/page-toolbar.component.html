<div class="page-toolbar">
  <div class="toolbar-main flex flex-col flex-auto items-end justify-end gap-2 max-w-lg md:flex-row">
    @if (showSearch()) {
      <button
        #toggleBtn
        type="button"
        class="search__toggle"
        [class.search__toggle--active]="expanded()"
        [attr.aria-label]="expanded() ? t.collapseSearch : t.toggleSearch"
        [matTooltip]="expanded() ? t.collapseSearch : t.toggleSearch"
        [attr.aria-expanded]="expanded()"
        [attr.aria-controls]="searchInputId"
        (mousedown)="$event.preventDefault()"
        (click)="toggle()"
      >
        <!-- manage_search（放大鏡＋清單橫線）：「在這份清單裡找」，跟頁首全站搜尋的單純放大鏡（search）分開。 -->
        <span class="material-symbols-rounded" aria-hidden="true">manage_search</span>
      </button>

      <div class="search-row" [class.search-row--expanded]="expanded()">
        <div class="search-row__inner">
          <div class="search" [class.search--expanded]="expanded()">
            <input
              #searchInput
              (keydown.escape)="onEscape()"
              [id]="searchInputId"
              type="text"
              class="search__input"
              [tabindex]="expanded() ? 0 : -1"
              [attr.aria-label]="placeholderText()"
              [placeholder]="placeholderText()"
              [ngModel]="query()"
              (ngModelChange)="query.set($event)"
              (keydown.enter)="submitQuery()"
              (blur)="collapseIfEmpty()"
            />

            @if (query()) {
              <button
                type="button"
                class="search__clear"
                [attr.aria-label]="t.clearSearch"
                (mousedown)="$event.preventDefault()"
                (click)="clearKeepFocus()"
              >
                <span class="material-symbols-rounded" aria-hidden="true">close</span>
              </button>
            }

            @if (query().trim()) {
              <button
                type="button"
                matButton="tonal"
                class="search__submit w-20"
                [attr.aria-label]="t.submitSearch"
                (mousedown)="$event.preventDefault()"
                (click)="submitQuery()"
              >{{ t.submitSearch }}
              </button>
            }
          </div>
        </div>
      </div>
    }

    <div class="toolbar-actions">
      <ng-content select="[actions]" />
    </div>
  </div>

  <div class="filters">
    <ng-content select="[filters]" />

    @if (activeFilterCount() > 0) {
      <button mat-button class="clear-btn" type="button" (click)="clearAll.emit()">
        <span class="material-symbols-rounded" aria-hidden="true">close</span>
        {{ t.clearFilters }}
      </button>
    }
  </div>
</div>
