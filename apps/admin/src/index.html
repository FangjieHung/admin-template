<!doctype html>
<html lang="zh-Hant" data-paradigm="material" data-theme="verdant">
  <head>
    <meta charset="utf-8" />
    <title>Admin Template</title>
    <base href="/" />
    <!--
      ADR 0010／0013：按需質地與按需配色的開機腳本。必須在 <base> 之後（樣式檔網址相對於 base href）、在任何
      <link rel="stylesheet"> 之前（行內腳本會等前面的樣式表下載完才執行）。
      依 localStorage 設好 data-paradigm／data-theme；存的是按需質地或按需配色時，用 document.write 寫入由解析器插入的
      <link>（先質地、後配色，兩個同時下載）：它們會擋住首次繪製與 main.js 執行，所以第一個畫面就是存的外觀，
      不會先閃 Material 或 Verdant。兩個 <link> 都排在主樣式之前，層疊順序跟「全部編在主樣式裡」時一樣（質地 → 配色）。
      載入失敗就退回常駐質地／常駐配色、校正 localStorage，並在 <html data-texture-fallback>／<html data-color-fallback>
      留下 id，由 ThemeService.init() 提示。
      三份 id 清單要與 theme.token.ts 一致（scripts/texture-registration.spec.mjs 會檢查）。
    -->
    <script id="app-texture-boot">
      (function () {
        var onDemandTextures = ['linen', 'grid', 'soft-ui', 'clay', 'editorial', 'frosted', 'aero', 'ledger', 'cockpit'];
        var colorThemes = ['verdant', 'midnight', 'sandstone', 'azure', 'cool-grey', 'candy', 'mist-ink', 'glacier-blue', 'graphite', 'oled', 'signal'];
        var onDemandColors = ['midnight', 'sandstone', 'azure', 'cool-grey', 'candy', 'mist-ink', 'glacier-blue', 'graphite', 'oled', 'signal'];
        var html = document.documentElement;
        var paradigm = null;
        var theme = null;
        try {
          paradigm = localStorage.getItem('app.paradigm');
          theme = localStorage.getItem('app.theme');
        } catch (e) {}
        window.__appTextureFailed = function (link) {
          html.setAttribute('data-paradigm', 'material');
          html.setAttribute('data-texture-fallback', link.getAttribute('data-texture-css'));
          try {
            localStorage.setItem('app.paradigm', 'material');
          } catch (e) {}
          link.remove();
        };
        window.__appColorFailed = function (link) {
          html.setAttribute('data-theme', 'verdant');
          html.setAttribute('data-color-fallback', link.getAttribute('data-color-css'));
          try {
            localStorage.setItem('app.theme', 'verdant');
          } catch (e) {}
          link.remove();
        };
        var links = '';
        // material（常駐）或不認得的 id：維持上面 <html> 的 data-paradigm="material"，殘值由 ThemeService.init() 覆寫。
        if (onDemandTextures.indexOf(paradigm) >= 0) {
          html.setAttribute('data-paradigm', paradigm);
          links +=
            '<link rel="stylesheet" href="texture-' + paradigm + '.css" data-texture-css="' + paradigm + '"' +
            ' onload="this.dataset.state=\'loaded\'" onerror="__appTextureFailed(this)">';
        }
        // verdant（常駐）或不認得的 id：維持 data-theme="verdant"，殘值與不相容的組合由 ThemeService.init() 校正。
        if (colorThemes.indexOf(theme) >= 0) {
          html.setAttribute('data-theme', theme);
        }
        if (onDemandColors.indexOf(theme) >= 0) {
          links +=
            '<link rel="stylesheet" href="color-' + theme + '.css" data-color-css="' + theme + '"' +
            ' onload="this.dataset.state=\'loaded\'" onerror="__appColorFailed(this)">';
        }
        if (links) {
          document.write(links);
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-25..200&display=swap" rel="stylesheet" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
