<div class="app-shell">
  <mat-sidenav-container class="sidenav-container">
    <mat-sidenav
      #drawer
      class="app-sidenav"
      [class.collapsed]="!isMobile && collapsed"
      [mode]="isMobile ? 'over' : 'side'"
      [opened]="!bare() && (isMobile ? isSidenavOpen : true)"
      (closedStart)="isSidenavOpen = false"
      (transitionend)="onSidenavTransitionEnd()"
    >
      <app-side-nav
        [navItems]="navItems()"
        [collapsed]="collapsed"
        [isMobile]="isMobile"
        [openGroupLabel]="openGroupLabel"
        [currentGroupLabel]="currentGroupLabel"
        [activeRoute]="activeRoute()"
        [flyoutPositions]="flyoutPositions"
        (toggleCollapse)="toggleCollapsed()"
        (toggleGroup)="toggleGroup($event)"
        (navClick)="onNavClick()"
        (groupDetach)="openGroupLabel = null"
      />
    </mat-sidenav>

    <mat-sidenav-content class="content-area">
      <!-- 登入頁不套殼層（bare）：側欄收起、頁首與頁尾不顯示；router-outlet 維持同一個，頁面不會被建立兩次。 -->
      <app-header
        [style.display]="bare() ? 'none' : null"
        [defaultTitle]="defaultTitle"
        (menuToggle)="toggleSidenav()"
      />

      <main class="page-shell" [class.page-shell--fill]="fillPage()">
        <router-outlet />
      </main>

      <app-footer [style.display]="bare() ? 'none' : null" />
    </mat-sidenav-content>
  </mat-sidenav-container>

  <!-- 外觀浮動面板：開關在 /settings 與 /components/appearance-panel（AppearancePanelService）。掛在殼層最外層、
       position: fixed 浮動，跟目前路由無關，所以每一頁都在，可拖曳到不擋路的位置。
       面板本身＋它用到的 @angular/cdk/drag-drop 平常不需要，只有開關打開才載入（@defer），
       開關沒開時 Initial bundle 完全不含這兩塊。 -->
  @defer (when appearancePanel.visible()) {
    <lib-floating-appearance-panel />
  }
</div>
