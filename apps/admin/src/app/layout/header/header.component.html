<header class="topbar">
  <div class="topbar-lead">
    <button mat-icon-button class="menu-toggle" type="button" (click)="menuToggle.emit()">
      <span class="material-symbols-rounded" aria-hidden="true">menu</span>
    </button>

    @if (backTo(); as back) {
      <a class="topbar-back" [routerLink]="back" [attr.aria-label]="t.layout.back">
        <span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>
      </a>
    }

    <nav class="topbar-title" [attr.aria-label]="t.layout.breadcrumbAriaLabel">
      @for (crumb of breadcrumbs(); track crumb.label) {
        @if (crumb.route) {
          <a class="breadcrumb-link" [routerLink]="crumb.route">{{ crumb.label }}</a>
        } @else {
          <span class="breadcrumb-text">{{ crumb.label }}</span>
        }
        <span class="material-symbols-rounded breadcrumb-sep" aria-hidden="true">chevron_right</span>
      }
      <span class="topbar-heading">
        <h1 aria-current="page">{{ currentTitle() }}</h1>
        @if (titleExtraTemplate(); as extra) {
          <ng-container [ngTemplateOutlet]="extra" />
        }
      </span>
    </nav>
  </div>

  @if (toolbarTemplate(); as toolbar) {
    <div class="topbar-toolbar">
      <ng-container [ngTemplateOutlet]="toolbar" />
    </div>
  }

  <!-- 通知鈴鐺：面板與通知清單在 layout/notification-bell，第一次打開時才載入。徽章是 ::after（data-count），
       造型變數 --lib-notif-badge-* 由質地設在 .lib-notification-center。 -->
  <button
    mat-icon-button
    type="button"
    class="topbar-bell lib-notification-center"
    aria-haspopup="dialog"
    [attr.aria-label]="bellLabel()"
    [attr.data-count]="badge()"
    [attr.aria-expanded]="notifications.panelOpen()"
    [attr.aria-controls]="notifications.panelOpen() ? 'app-notification-panel' : null"
    (click)="notifications.toggle()"
  >
    <span class="material-symbols-rounded" aria-hidden="true">notifications</span>
  </button>
</header>
