<div>
  <ng-template appHeaderToolbar>
    <lib-page-toolbar [(query)]="query">
      <lib-filter-select
        filters
        label="狀態"
        [options]="statusOptions"
        [value]="quickStatus()"
        (valueChange)="setQuickStatus($event)"
      />
      <lib-advanced-filter
        filters
        [fields]="fields"
        [labels]="filterLabels"
        [conditions]="view.filters()"
        (conditionsChange)="setFilters($event)"
      />
    </lib-page-toolbar>
  </ng-template>

  <div class="demo-controls">
    <lib-saved-views [controller]="view" [labels]="savedViewsLabels" />
    <lib-filter-chips
      [fields]="fields"
      [labels]="filterLabels"
      [conditions]="view.filters()"
      (conditionsChange)="setFilters($event)"
    />
  </div>

  <div class="ui-card !p-0">
    <lib-data-table
      [columns]="columns"
      [rows]="filteredItems()"
      [labels]="tableLabels"
      [selectable]="true"
      [showBatchDelete]="false"
      [pageable]="true"
      [sortable]="true"
      [columnChooser]="true"
      [(sort)]="view.sort"
      [(pageSize)]="view.pageSize"
      [(page)]="view.page"
      [(columnPrefs)]="view.columns"
      emptyText="沒有符合條件的資料"
      exportName="demo-items"
      (exportFailed)="onExportFailed($event)"
    >
      <ng-template dtCell="code" let-r><span class="ui-text-numeric">{{ r.code }}</span></ng-template>
      <ng-template dtCell="status" let-r>
        <app-status-chip [label]="statusLabel(r)" [status]="statusTone(r)" />
      </ng-template>
      <ng-template dtCell="category" let-r>{{ categoryLabel(r) }}</ng-template>
      <ng-template dtCell="createdAt" let-r><span class="ui-text-numeric">{{ fmt(r.createdAt) }}</span></ng-template>
      <ng-template dtCell="dueAt" let-r><span class="ui-text-numeric">{{ fmt(r.dueAt) }}</span></ng-template>
    </lib-data-table>
  </div>
</div>
