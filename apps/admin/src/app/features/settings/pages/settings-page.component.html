<!-- 2.1：標題改在頁首（provideHeaderTitle，見 settings-page.component.ts constructor）。 -->
<section class="ui-card settings-page p-4 sm:p-6">
  <div class="appearance-settings" aria-labelledby="appearance-title">
    <div>
      <p class="ui-text-caption">外觀</p>
      <h2 id="appearance-title" class="ui-text-subtitle">外觀設定</h2>
    </div>

    <div class="theme-row">
      <span class="theme-row__label">質地</span>
      <div class="theme-row__options" role="group" aria-label="質地">
        @for (option of texture; track option.id) {
          <button
            type="button"
            class="theme-pill"
            [class.is-active]="theme.paradigm() === option.id"
            [attr.aria-pressed]="theme.paradigm() === option.id"
            [attr.data-paradigm-id]="option.id"
            (click)="onParadigm(option.id)"
          >
            {{ option.label }}
          </button>
        }
      </div>
    </div>

    <div class="theme-row">
      <span class="theme-row__label">配色</span>
      <div class="theme-row__options" role="group" aria-label="配色">
        @for (option of colorThemes(); track option.id) {
          <button
            type="button"
            class="theme-pill"
            [class.is-active]="theme.theme() === option.id"
            [attr.aria-pressed]="theme.theme() === option.id"
            [attr.data-theme-id]="option.id"
            (click)="onTheme(option.id)"
          >
            {{ option.label }}
          </button>
        }
      </div>
    </div>

    <!-- ticket 03：外觀浮動面板開關，狀態放在 AppearancePanelService，跟 app shell 掛的浮動面板同步。 -->
    <div class="theme-row appearance-panel-toggle">
      <mat-slide-toggle [checked]="appearancePanel.visible()" (change)="onAppearancePanelToggle($event)">
        顯示外觀浮動面板
      </mat-slide-toggle>
      <p class="ui-text-caption">開啟後，每一頁角落會出現一顆按鈕，可即時切換質地與配色。</p>
    </div>
  </div>
</section>
