<div>
  <ng-template appHeaderToolbar>
    <lib-page-toolbar [showSearch]="false">
      <button actions mat-flat-button (click)="openForm(null)">
        <span class="material-symbols-rounded" aria-hidden="true">add</span>
        {{ t.common.create }}
      </button>
    </lib-page-toolbar>
  </ng-template>

  <div class="ui-card !p-0">
    <lib-data-table
      [columns]="columns"
      [rows]="store.addOns()"
      [labels]="labels"
      [selectable]="true"
      [selection]="selectedAddOns()"
      [emptyText]="t.common.empty"
      exportName="add-ons"
      (selectionChange)="selectedAddOns.set($event)"
      (batchDelete)="removeSelected($event)"
      (exportFailed)="onExportFailed($event)"
    >
      <ng-template dtCell="unitPrice" let-a>{{ a.unitPrice | twd }}</ng-template>
      <ng-template dtCell="unit" let-a>{{ t.addOn.unitLabels[a.unit] }}</ng-template>
      <ng-template dtCell="actions" let-a>
        <span class="action-cell">
          <button mat-icon-button [matTooltip]="t.common.edit" [attr.aria-label]="t.common.edit" (click)="openForm(a)">
            <span class="material-symbols-rounded" aria-hidden="true">edit</span>
          </button>
          <button mat-icon-button color="warn" [matTooltip]="t.common.delete" [attr.aria-label]="t.common.delete" (click)="remove(a)">
            <span class="material-symbols-rounded" aria-hidden="true">delete</span>
          </button>
        </span>
      </ng-template>
    </lib-data-table>
  </div>
</div>
