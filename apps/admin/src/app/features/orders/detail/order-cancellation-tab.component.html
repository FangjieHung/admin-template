<div class="cancellation-tab">
  <section class="ui-card cancellation-tab__stage" data-stage="cancel" [attr.aria-labelledby]="titleIds.cancel">
    <h2 class="cancellation-tab__title" [id]="titleIds.cancel">
      <span class="cancellation-tab__step ui-text-numeric" aria-hidden="true">1</span>
      {{ t.orderDetail.cancellationStages.cancel }}
    </h2>
    <app-cancellation-panel [bookingId]="bookingId()" />
    <app-operator-recovery-panel [bookingId]="bookingId()" [allowNewCase]="canCancel()" />
  </section>

  <section class="ui-card cancellation-tab__stage" data-stage="refund" [attr.aria-labelledby]="titleIds.refund">
    <h2 class="cancellation-tab__title" [id]="titleIds.refund">
      <span class="cancellation-tab__step ui-text-numeric" aria-hidden="true">2</span>
      {{ t.orderDetail.cancellationStages.refund }}
    </h2>
    <app-customer-credit-panel [bookingId]="bookingId()" part="refund" />
  </section>

  <section class="ui-card cancellation-tab__stage" data-stage="credit" [attr.aria-labelledby]="titleIds.credit">
    <h2 class="cancellation-tab__title" [id]="titleIds.credit">
      <span class="cancellation-tab__step ui-text-numeric" aria-hidden="true">3</span>
      {{ t.orderDetail.cancellationStages.credit }}
    </h2>
    <app-customer-credit-panel [bookingId]="bookingId()" part="credit" />
  </section>
</div>
