<section class="ui-card incomplete-card" [attr.aria-labelledby]="titleId">
  <h2 class="incomplete-card__title" [id]="titleId">
    <span class="material-symbols-rounded incomplete-card__icon" aria-hidden="true">assignment_late</span>
    {{ t.orderDetail.incomplete.title }}
    <span class="incomplete-card__count ui-text-numeric">{{ items().length }}</span>
  </h2>
  <ul class="incomplete-card__list">
    @for (item of items(); track item.kind) {
      <li>
        <button type="button" class="incomplete-card__item" [attr.data-kind]="item.kind" (click)="selectItem.emit(item)">
          <span class="incomplete-card__label">{{ item.label }}</span>
          <span class="incomplete-card__action">{{ t.orderDetail.incomplete.actions[item.target] }}</span>
          <span class="material-symbols-rounded incomplete-card__chevron" aria-hidden="true">chevron_right</span>
        </button>
      </li>
    }
  </ul>
</section>
