<div>
  <ng-template appHeaderToolbar>
    <lib-page-toolbar [showSearch]="false">
      <button actions mat-flat-button (click)="openForm(null)">
        <span class="material-symbols-rounded" aria-hidden="true">person_add</span>
        {{ t.common.create }}
      </button>
    </lib-page-toolbar>
  </ng-template>

  @if (store.members().length === 0) {
    <p class="empty-state">{{ t.common.empty }}</p>
  } @else {
    <div class="ui-card !p-0">
      <lib-data-table
        [columns]="columns"
        [rows]="store.members()"
        [labels]="labels"
        [emptyText]="t.common.empty"
        exportName="members"
        (exportFailed)="onExportFailed($event)"
      >
        <ng-template dtCell="phone" let-c><span class="text-secondary">{{ c.phone }}</span></ng-template>
        <ng-template dtCell="kind" let-c
          ><span class="text-secondary">{{ t.member.kindLabels[c.kind] ?? c.kind }}</span></ng-template
        >
        <ng-template dtCell="idNumber" let-c
          ><span class="text-secondary">{{ c.idNumber ?? '—' }}</span></ng-template
        >
        <ng-template dtCell="note" let-c><span class="text-secondary">{{ c.note ?? '' }}</span></ng-template>
        <ng-template dtCell="actions" let-c>
          <span class="action-cell">
            <button mat-icon-button [matTooltip]="t.common.edit" [attr.aria-label]="t.common.edit" (click)="openForm(c)">
              <span class="material-symbols-rounded" aria-hidden="true">edit</span>
            </button>
            <button mat-icon-button color="warn" [matTooltip]="t.common.delete" [attr.aria-label]="t.common.delete" (click)="remove(c)">
              <span class="material-symbols-rounded" aria-hidden="true">delete</span>
            </button>
          </span>
        </ng-template>
      </lib-data-table>
    </div>
  }
</div>
