<div>
  <ng-template appHeaderToolbar>
    <lib-page-toolbar [showSearch]="false">
      <button actions mat-flat-button (click)="openForm(null)">
        <span class="material-symbols-rounded" aria-hidden="true">add</span>
        {{ t.common.create }}
      </button>
    </lib-page-toolbar>
  </ng-template>

  @if (store.partners().length === 0) {
    <p class="empty-state">{{ t.common.empty }}</p>
  } @else {
    <div class="ui-card !p-0">
      <lib-data-table
        [columns]="columns"
        [rows]="store.partners()"
        [labels]="labels"
        [emptyText]="t.common.empty"
        exportName="partners"
        (exportFailed)="onExportFailed($event)"
      >
        <ng-template dtCell="discountPercent" let-p>{{ p.discountPercent }}%</ng-template>
        <ng-template dtCell="commission" let-p>
          {{ t.partner.commissionTypeLabels[p.commission.type] }}（{{ commissionValueLabel(p) }}）
        </ng-template>
        <ng-template dtCell="actions" let-p>
          <span class="action-cell">
            <button mat-icon-button [matTooltip]="t.partner.copyLink" [attr.aria-label]="t.partner.copyLink" (click)="copyLink(p)">
              <span class="material-symbols-rounded" aria-hidden="true">link</span>
            </button>
            <button mat-icon-button [matTooltip]="t.common.edit" [attr.aria-label]="t.common.edit" (click)="openForm(p)">
              <span class="material-symbols-rounded" aria-hidden="true">edit</span>
            </button>
            <button mat-icon-button color="warn" [matTooltip]="t.common.delete" [attr.aria-label]="t.common.delete" (click)="remove(p)">
              <span class="material-symbols-rounded" aria-hidden="true">delete</span>
            </button>
          </span>
        </ng-template>
      </lib-data-table>
    </div>
  }
</div>
